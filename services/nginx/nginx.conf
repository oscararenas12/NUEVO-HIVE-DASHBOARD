upstream api {
    server api:5000;
}

upstream client {
    server client:3000;
}

server {
    listen 80;

    # API requests: strip /api prefix and forward to the FastAPI backend.
    # proxy_cookie_path rewrites Set-Cookie path=/auth → path=/api/auth so
    # the browser sends the refresh-token cookie on /api/auth/* requests.
    location /api/ {
        proxy_pass         http://api/;
        proxy_cookie_path  /auth /api/auth;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else → Vite dev server (includes WebSocket for HMR).
    location / {
        proxy_pass         http://client;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }
}
